<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="img/logo.webp" />
  <title>Contact - Modern Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Courgette&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #fff;
      font-family: 'Courgette', cursive;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-bottom: 1px solid rgba(218, 28, 138, 0.1);
      padding: 20px 0;
      z-index: 1000;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      border-radius: 15px;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: rgb(218, 28, 138);
      text-decoration: none;
      font-weight: 600;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: rgb(218, 28, 138);
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .contact {
      padding: 150px 20px 80px;
      text-align: center;
    }

    .section-title {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      color: rgb(218, 28, 138);
      margin-bottom: 30px;
      font-weight: 700;
    }

    .contact-grid {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 0 auto;
    }

    .contact-card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      flex: 1 1 300px;
      transition: transform 0.3s ease;
    }

    .contact-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(218, 28, 138, 0.15);
    }

    .contact-icon {
      font-size: 2.5rem;
      color: rgb(218, 28, 138);
      margin-bottom: 15px;
    }

    .contact-info {
      font-size: 1.1rem;
      color: #555;
      font-weight: 500;
    }

    .footer {
      background: white;
      color: rgb(218, 28, 138);
      text-align: center;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <img src="img/logo.webp" alt="Logo" class="logo" />
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
      </nav>
    </div>
  </header>

  <section class="contact">
    <h2 class="section-title">Contact Me</h2>
    <div class="contact-grid">
      <div class="contact-card">
        <div class="contact-icon">📞</div>
        <div class="contact-info">+212 6 12 34 56 78</div>
      </div>
      <div class="contact-card">
        <div class="contact-icon">📧</div>
        <div class="contact-info">assiaalilech07@gmail.com</div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2025 My Portfolio - All Rights Reserved</p>
      <p>Looking forward to hearing from you!</p>
    </div>
  </footer>
</body>
</html>
